[package]
name = "cleanos"
version = "0.1.0"
edition = "2021"
description = "CleanOS measures macOS bottlenecks and ranks reversible findings by evidence."
license = "MIT"
readme = "README.md"

[[bin]]
name = "cleanos"
path = "src/main.rs"

[lib]
name = "cleanos"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
